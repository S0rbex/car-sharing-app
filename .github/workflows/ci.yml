name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        ports:
          - 1521:1521
        env:
          ORACLE_PASSWORD: mateacad26
          ORACLE_DATABASE: FREEPDB1
        options: >-
          --health-cmd "echo exit | sqlplus -s sys/mateacad26@localhost:1521/FREEPDB1 as sysdba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:oracle:thin:@localhost:1521/FREEPDB1
          SPRING_DATASOURCE_USERNAME: system
          SPRING_DATASOURCE_PASSWORD: mateacad26
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
        run: mvn -B package --file pom.xml